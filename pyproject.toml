[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-canary"
version = "0.1.0"
description = "Release gate for LLM endpoints: compare a candidate (e.g. Cortensor) with your baseline on a deterministic task suite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Cortensor Canary contributors" }]
keywords = ["cortensor", "openminion", "llm", "evaluation", "release-gate"]
dependencies = []

[project.optional-dependencies]
openminion = ["openminion>=0.1.14"]
test = []

[project.scripts]
cortensor-canary = "cortensor_canary.cli:main"
canary = "cortensor_canary.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortensor_canary = ["data/suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
